# Use the spoofed X-Forwarded-For if the client sent one,
# otherwise fall back to the real connecting address.
map $http_x_forwarded_for $client_ip {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

log_format json_access escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"ip":"$client_ip",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$query_string",'
    '"status":$status,'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"body":""'
  '}';

server {
    listen 80;

    # Every request is written as one JSON line to the shared volume.
    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://juiceshop:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Keep the spoofed IP if present, otherwise the real one.
        proxy_set_header X-Forwarded-For   $client_ip;
    }
}